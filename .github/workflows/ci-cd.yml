name: CI/CD — myHealth Flutter Web

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.35.7"

# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ── 1. Static Analysis ────────────────────────────────────────────────────
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter (cached)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: flutter-${{ env.FLUTTER_VERSION }}-${{ runner.os }}

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (no fatal infos)
        run: flutter analyze --no-fatal-infos

  # ── 2. Build Flutter Web ──────────────────────────────────────────────────
  build:
    name: Build Web
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter (cached)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: flutter-${{ env.FLUTTER_VERSION }}-${{ runner.os }}

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web — release
        run: |
          flutter build web \
            --release \
            --no-tree-shake-icons \
            --base-href /

      # Inject Vercel SPA routing config into the build output
      - name: Write vercel.json into build/web
        run: |
          cat > build/web/vercel.json << 'EOF'
          {
            "rewrites": [
              { "source": "/((?!.*\\.).*)", "destination": "/index.html" }
            ],
            "headers": [
              {
                "source": "/(.*)\\.wasm",
                "headers": [{ "key": "Content-Type", "value": "application/wasm" }]
              },
              {
                "source": "/(.*)\\.js",
                "headers": [{ "key": "Cache-Control", "value": "public, max-age=31536000, immutable" }]
              },
              {
                "source": "/assets/(.*)",
                "headers": [{ "key": "Cache-Control", "value": "public, max-age=31536000, immutable" }]
              },
              {
                "source": "/index.html",
                "headers": [{ "key": "Cache-Control", "value": "no-cache, no-store, must-revalidate" }]
              }
            ]
          }
          EOF

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-${{ github.sha }}
          path: build/web/
          retention-days: 7

  # ── 3. Deploy to Vercel (master / main only) ──────────────────────────────
  deploy:
    name: Deploy → Vercel
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: flutter-web-${{ github.sha }}
          path: build/web/

      # Wire up Vercel project linking inside build/web so the CLI
      # knows which project to deploy to without interactive prompts
      - name: Link Vercel project
        run: |
          mkdir -p build/web/.vercel
          printf '{"projectId":"%s","orgId":"%s"}' \
            "${{ secrets.VERCEL_PROJECT_ID }}" \
            "${{ secrets.VERCEL_ORG_ID }}" \
            > build/web/.vercel/project.json

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel (production)
        id: deploy
        working-directory: build/web
        run: |
          URL=$(vercel --prod \
            --token="${{ secrets.VERCEL_TOKEN }}" \
            --yes \
            2>&1 | tail -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $URL"

      - name: Comment deployment URL on PR (if applicable)
        if: github.event.pull_request.number != ''
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 Deployed to Vercel: ${{ steps.deploy.outputs.url }}`
            })
