version: "3.9"

services:
  myhealth-web:
    build:
      context: .
      dockerfile: Dockerfile
      # cache_from tells Docker to reuse layers from a previously pulled image
      cache_from:
        - myhealth-web:latest
    image: myhealth-web:latest
    container_name: myhealth-web
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
